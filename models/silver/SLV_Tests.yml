version: 2

models:
  - name: SLV_ADJUSTER
    columns:

      - name: adjuster_id
        tests:
          - not_null

      - name: approved_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
             arguments: 
              min_value: 0

      - name: documentation_complete
        tests:
          - accepted_values:
             arguments:
              values: ["Yes", "No"]

      - name: estimated_loss_amount
        tests:
          - dbt_utils.accepted_range:
             arguments:
              min_value: 0

  - name: SLV_INCIDENT
    columns: 
       - name: incident_country
         tests:
          - accepted_values:
              arguments:
               values: ['INDIA']
               severnity: error #Pipe line will fail if there is an data missmatch
