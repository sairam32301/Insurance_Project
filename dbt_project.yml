name: 'Insurance_Analytics_DBT'
version: '1.0.0'
config-version: 2
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  Insurance_Analytics_DBT:
    # Default materialization changed from transient to table
    +materialized: view
    +transient: false
    bronze:
    # Bronze kept as view for raw ingestion layer
      +schema: bronze
      +materialized: view
    silver:
     +schema: silver
     +materialized: table
    gold:
     +schema: gold
     +materialized: table
seeds:
  Insurance_Analytics_DBT:
    +schema: seed
            
